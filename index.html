<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game That Neutrino — Collaborator Game</title>
    <meta name="description" content="Classify IceCube event displays, earn coins, and compare your intuition with the crowd. A neutrino classification game by Peter Tzimoulis." />
    <link rel="stylesheet" href="./styles.css?v=endless-full-20261015-2" />
  </head>
  <body>
    <div class="background-glow background-glow-left"></div>
    <div class="background-glow background-glow-right"></div>
    <div class="background-grid"></div>

    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Particle Classification</p>
          <h1 class="brand-title">Game That Neutrino</h1>
        </div>

        <div class="topbar-actions">
          <div id="account-controls"></div>
          <button type="button" class="ghost-button trophy-nav" data-action="open-achievements">🏆 Achievements</button>
          <button type="button" class="ghost-button" data-action="open-intro">About the game</button>
          <a class="ghost-button button-link" href="./about-me.html">About Me</a>
          <button
            type="button"
            class="ghost-button"
            id="home-button"
            data-action="go-home"
          >
            Home
          </button>
          <button
            type="button"
            class="secondary-button"
            id="help-button"
            data-action="open-help"
          >
            Tutorial &amp; Help
          </button>
          <button
            type="button"
            class="ghost-button"
            id="analysis-button"
            data-action="open-analysis"
          >
            Analysis &amp; Export
          </button>
        </div>
      </header>

      <main id="app" class="app-root" aria-live="polite"></main>
      <footer class="site-credits">Created by <a href="./about-me.html"><strong>Peter Tzimoulis</strong></a> · Credits &amp; acknowledgments: <strong>Name That Neutrino team at Drexel University</strong> · <a href="https://icecube.wisc.edu/" target="_blank" rel="noopener noreferrer">IceCube Collaboration</a></footer>

    <div id="achievement-modal-root"></div>
    <div id="achievement-toast-root"></div>
    <div id="intro-modal-root"></div>

    <div id="account-modal-root"></div>

    <noscript>
      <div class="noscript-banner">
        JavaScript is required to run Game That Neutrino.
      </div>
    </noscript>

    <script src="./site-config.js"></script>
    <script src="./endless.js?v=endless-full-20261015-2"></script>
    <script src="./app.js?v=endless-full-20261015-2"></script>
    <script src="./accounts.js?v=endless-full-20261015-2"></script>
