services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neutrino
      POSTGRES_USER: neutrino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U neutrino -d neutrino"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrate:
    build: .
    environment: &app_env
      DATABASE_URL: postgresql://neutrino:${POSTGRES_PASSWORD}@db:5432/neutrino
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
    depends_on:
      db: {condition: service_healthy}
    command: [python, manage.py, migrate]
    logging: *logging
  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app_env
      WEB_WORKERS: ${WEB_WORKERS:-4}
      WEB_THREADS: ${WEB_THREADS:-8}
      VIDEO_BASE_URL: ${VIDEO_BASE_URL:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    logging: *logging
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [web]
    logging: *logging
volumes:
  database:
  certificates:
  caddy_config:
