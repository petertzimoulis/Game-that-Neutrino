worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_rlimit_nofile 65535;
events { worker_connections 8192; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json text/csv image/svg+xml;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=128m inactive=5m use_temp_path=off;
    map "$request_method:$uri:$arg_view" $skip_cache {
        default 1;
        ~^GET:/api/(players|collaborator-players|quiz-players|quick-quiz-players|endless-players|achievements|analytics):$ 0;
    }
    # Bound the rate of writes reaching Python while nginx holds burst connections.
    # A shared key also works for classrooms and conferences behind one public IP.
    map $request_method $write_queue_key { default ""; POST shared_writes; }
    limit_req_zone $write_queue_key zone=write_burst:1m rate=500r/s;
    upstream application {
        server app:8000;
        keepalive 64;
    }
    server {
        listen 8080;
        server_tokens off;
        root /srv/neutrino;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location /api/ {
            limit_req zone=write_burst burst=2000 delay=20;
            limit_req_status 429;
            limit_req_log_level notice;
            proxy_pass http://application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_cache api;
            proxy_cache_key "$host$uri";
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_background_update on;
            proxy_cache_use_stale updating;
            add_header X-Cache $upstream_cache_status always;
        }
        location ~ ^/videos/.+\.(mp4|csv)$ {
            try_files $uri =404;
            # Native static-file byte ranges let browsers seek without loading a full clip.
            expires 1d;
        }
        location ~ ^/(app\.js|accounts\.js|endless\.js|styles\.css|coin\.png|peter-tzimoulis\.jpg)$ {
            try_files $uri =404;
            # Version query strings in index.html change on each release.
            expires 1h;
        }
        location = /site-config.js {
            proxy_pass http://application;
            proxy_cache api;
            proxy_cache_key "$host$uri";
            proxy_cache_lock on;
        }
        location = / { try_files /index.html =404; expires -1; }
        location = /index.html { expires -1; }
        location = /about-me.html { try_files /about-me.html =404; expires -1; }
        location = /4.0.html { expires -1; }
        location / { return 404; }
    }
}
